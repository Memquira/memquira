name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same toolchain as the Docker builder (docker/Dockerfile).
  RUST_TOOLCHAIN: "1.89.0"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # About 140 test binaries are linked; line tables keep backtraces readable and the target directory within
      # the runner's disk.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # The runner image's preinstalled SDKs this job never uses (.NET, Android, GHC, CodeQL): about 25 GB.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Own cache: a fallback restore of another configuration's target directory, next to a full build,
          # ran the runner out of disk.
          prefix-key: v1-test-lines
      # SQLite, mocks and in-process fakes only: tests against real PostgreSQL / Qdrant skip without their
      # MEMQUIRA_TEST_* variables, and no test calls a model provider.
      - run: cargo test --workspace

  integration:
    name: Integration (PostgreSQL + Qdrant)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.18.0
        ports: ["6334:6334"]
    env:
      MEMQUIRA_TEST_POSTGRES_URL: postgres://postgres:ci-only-password@127.0.0.1:55432/postgres
      MEMQUIRA_TEST_QDRANT_URL: http://127.0.0.1:6334
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p memquira-storage --features postgres,qdrant -- --test-threads 1

  features:
    name: Feature builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p memquira-api --features postgres,qdrant
      - run: cargo check -p memquira-api --features redis-cache

  supply-chain:
    name: Dependencies and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - name: Third-party licence file is current
        run: |
          cargo fetch --locked
          python3 scripts/release/third_party_licenses.py --check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - run: gitleaks dir . --config .gitleaks.toml --redact --no-banner

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: CARGO_FEATURES=postgres,qdrant
          push: false
          tags: memquira:ci

  python-client:
    name: Python client (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # Unit tests use a mocked transport; the end-to-end tests skip here and run in the next job.
      - run: pytest -q

  python-client-e2e:
    name: Python client end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p memquira-api --bin memquira-api
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e "clients/python[test]"
      # The local development configuration: SQLite, mock vector store and mock models, so no provider is called.
      - name: Start memquira-api
        env:
          MEMQUIRA_ENV: development
          MEMQUIRA_HOST: 127.0.0.1
          MEMQUIRA_PORT: "8080"
          MEMQUIRA_STORAGE_MODE: embedded
          MEMQUIRA_FACT_BACKEND: sqlite
          MEMQUIRA_EVENT_BACKEND: sqlite
          MEMQUIRA_VECTOR_BACKEND: mock
          MEMQUIRA_DATABASE_URL: sqlite://${{ runner.temp }}/memcore.db?mode=rwc
          MEMQUIRA_EPISODES_ENABLED: "true"
          MEMQUIRA_SEARCH_MAX_LIMIT: "100"
          MEMQUIRA_LLM_PROVIDER: mock
          MEMQUIRA_LLM_MODEL: mock-llm
          MEMQUIRA_EMBEDDING_PROVIDER: mock
          MEMQUIRA_EMBEDDING_MODEL: mock-embedding
          MEMQUIRA_ALLOW_MOCK: "true"
          MEMQUIRA_AUTH_ENABLED: "true"
          MEMQUIRA_AUTH_MODE: dev
          MEMQUIRA_DEV_API_KEY: memcore_dev_key
          MEMQUIRA_RATE_LIMIT_ENABLED: "false"
          MEMQUIRA_LOG_FORMAT: json
          MEMQUIRA_LOG_LEVEL: warn
        run: |
          nohup target/debug/memquira-api > "${RUNNER_TEMP}/memquira-api.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/health/ready > /dev/null && exit 0
            sleep 1
          done
          cat "${RUNNER_TEMP}/memquira-api.log"
          exit 1
      - name: End-to-end tests
        working-directory: clients/python
        env:
          MEMQUIRA_E2E_URL: http://127.0.0.1:8080
          MEMQUIRA_E2E_API_KEY: memcore_dev_key
          MEMQUIRA_E2E_ORG_ID: ci
        run: pytest -q -rs tests/test_e2e_local.py
      - name: Server log on failure
        if: failure()
        run: cat "${RUNNER_TEMP}/memquira-api.log"
