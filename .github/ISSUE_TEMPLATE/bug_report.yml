name: Bug report
description: Something in Memquira does not work as documented.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go to [private vulnerability reporting](https://github.com/Memquira/memquira/security/advisories/new), not to a public issue.

        Never paste API keys, tokens, passwords, credentials in connection strings, or real user data. Redact them (for example `mc_live_<redacted>`).
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of commands or requests that shows the problem.
      placeholder: |
        1. docker compose -f docker/docker-compose.local.yml up -d --build
        2. curl -s -X POST http://127.0.0.1:8080/api/v1/memories ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Memquira version
      description: From `GET /api/v1/version`, the image tag, or the commit.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How do you run Memquira?
      options:
        - Docker Compose, local stack (docker-compose.local.yml)
        - Docker Compose, production stack (docker-compose.prod.yml)
        - Docker image with other orchestration
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Storage backends
      multiple: true
      options:
        - SQLite
        - PostgreSQL
        - Qdrant
        - Mock / in-memory
        - Not sure
  - type: input
    id: providers
    attributes:
      label: Model providers
      description: Provider and model names only, for example `openai` / `gpt-4o-mini`. No keys.
  - type: textarea
    id: logs
    attributes:
      label: Error responses or logs
      description: Relevant lines only, with secrets and personal data removed.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues.
          required: true
        - label: This report contains no API keys, tokens, passwords or personal data.
          required: true
