name: Feature request
description: Propose a new capability or a change in behaviour.
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The behaviour, API or configuration you would like. Examples of requests and responses help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other designs you considered.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API
        - Ingestion and fact extraction
        - Retrieval and context assembly
        - Storage (SQLite, PostgreSQL, Qdrant)
        - Model providers
        - Deployment and Docker
        - Security and authentication
        - Observability
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues.
          required: true
        - label: I would like to work on this myself.
