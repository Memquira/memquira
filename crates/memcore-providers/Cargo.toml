[package]
name = "memcore-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
memcore-common = { path = "../memcore-common" }
memcore-core = { path = "../memcore-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
# Launch T19: Retry-After as an HTTP date (already in the dependency tree via hyper).
httpdate = "1"
tracing = "0.1"
uuid = { version = "1", features = ["serde"] }
# Phase 4 (D197): optional rerank providers; neither is compiled into the default build.
ort = { version = "=2.0.0-rc.13", optional = true }
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["onig"] }
# Launch T19: identity hashes of embedding prefixes (also used by local-rerank).
sha2 = "0.10"
hex = "0.4"
aws-config = { version = "1", optional = true, default-features = false, features = ["rt-tokio", "rustls", "credentials-process", "sso"] }
# Launch AR-091: the SDK's `rustls` feature selects the legacy rustls 0.21 / hyper 0.14 client, which has no
# patched release (RUSTSEC-2026-0346 / -0349 / -0382); `default-https-client` is the rustls 0.23 client that
# `aws-config` already uses.
aws-sdk-bedrockagentruntime = { version = "1", optional = true, default-features = false, features = ["rt-tokio", "default-https-client"] }

[features]
default = []
# Local ONNX cross-encoder reranker (bge-reranker-v2-m3 INT8). Model files are never downloaded or
# bundled: the operator supplies the paths and checksums.
local-rerank = ["dep:ort", "dep:tokenizers"]
# Amazon Bedrock Rerank (Agents Runtime `Rerank`, SigV4 through the standard AWS credential chain).
bedrock-rerank = ["dep:aws-config", "dep:aws-sdk-bedrockagentruntime"]

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
memcore-storage = { path = "../memcore-storage" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6"
