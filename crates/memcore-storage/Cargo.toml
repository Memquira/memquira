[package]
name = "memcore-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
# Launch AR-091 (owner L3): the legacy optional `lancedb` feature was removed. Its `lancedb` 0.18.2 dependency forced
# `lance/dynamodb`, whose AWS SDK client pulled rustls 0.21 / rustls-webpki 0.101 (no patched release).
qdrant = ["dep:qdrant-client"]
redis-cache = ["dep:redis"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
qdrant-client = { version = "1.18", optional = true }
redis = { version = "0.28", optional = true, features = ["tokio-comp", "connection-manager"] }
memcore-common = { path = "../memcore-common" }
memcore-core = { path = "../memcore-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "uuid", "chrono", "json", "migrate"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }

[[test]]
name = "postgres_fact_store"
required-features = ["postgres"]

[[test]]
name = "postgres_provider_usage_summary"
required-features = ["postgres"]

[[test]]
name = "postgres_event_store"
required-features = ["postgres"]

[[test]]
name = "postgres_api_key_store"
required-features = ["postgres"]

[[test]]
name = "postgres_fact_fulltext"
required-features = ["postgres"]

[[test]]
name = "postgres_episode_storage"
required-features = ["postgres"]

[[test]]
name = "postgres_fact_supersession"
required-features = ["postgres"]

[[test]]
name = "postgres_entity_storage"
required-features = ["postgres"]

[[test]]
name = "qdrant_vector_store"
required-features = ["qdrant"]

[[test]]
name = "qdrant_payload_indexes"
required-features = ["qdrant"]

[[test]]
name = "qdrant_write_path"
required-features = ["qdrant"]

[[test]]
name = "qdrant_embedding_identity"
required-features = ["qdrant"]

[[test]]
name = "redis_context_cache"
required-features = ["redis-cache"]
