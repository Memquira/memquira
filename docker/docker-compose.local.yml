# Local development and the quick start: SQLite facts, an in-memory mock vector store and mock
# LLM / embedding providers. No external services, no API keys, no paid calls. Not for production.
#
#   docker compose -f docker/docker-compose.local.yml up -d --build
#
# The API key is the local development key `memcore_dev_key` (docs/getting-started.md).

name: memquira-local

services:
  memquira:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      # Loopback only: the local development key is public.
      - "127.0.0.1:8080:8080"
    environment:
      MEMQUIRA_ENV: development
      MEMQUIRA_HOST: 0.0.0.0
      MEMQUIRA_PORT: 8080

      MEMQUIRA_STORAGE_MODE: embedded
      MEMQUIRA_FACT_BACKEND: sqlite
      MEMQUIRA_EVENT_BACKEND: sqlite
      MEMQUIRA_VECTOR_BACKEND: mock

      # `mode=rwc` lets SQLite create the database file on first start.
      MEMQUIRA_DATABASE_URL: sqlite:///app/data/memcore.db?mode=rwc
      MEMQUIRA_DATABASE_MIGRATION_MODE: auto

      # A search limit of 100 is required by POST /api/v1/memories/context; episodes add source messages
      # to the context and enable message-id deduplication.
      MEMQUIRA_EPISODES_ENABLED: "true"
      MEMQUIRA_SEARCH_MAX_LIMIT: 100

      MEMQUIRA_LLM_PROVIDER: mock
      MEMQUIRA_LLM_MODEL: mock-llm
      MEMQUIRA_EMBEDDING_PROVIDER: mock
      MEMQUIRA_EMBEDDING_MODEL: mock-embedding
      # Local development only: the server refuses mock providers unless this is set.
      MEMQUIRA_ALLOW_MOCK: "true"

      MEMQUIRA_AUTH_ENABLED: "true"
      MEMQUIRA_AUTH_MODE: dev
      MEMQUIRA_DEV_API_KEY: memcore_dev_key

      MEMQUIRA_RATE_LIMIT_ENABLED: "true"
      MEMQUIRA_RATE_LIMIT_REQUESTS_PER_MINUTE: 60

      MEMQUIRA_LOG_FORMAT: pretty
      MEMQUIRA_LOG_LEVEL: info
      MEMQUIRA_METRICS_ENABLED: "true"
      MEMQUIRA_CORS_ENABLED: "false"
    volumes:
      - memcore_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  memcore_data:
