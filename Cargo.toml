[workspace]
members = [
    "crates/memquira-api",
    "crates/memquira-core",
    "crates/memquira-storage",
    "crates/memquira-providers",
    "crates/memquira-config",
    "crates/memquira-common",
]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/memquira/memquira"
homepage = "https://github.com/memquira/memquira"

# Temporary exceptions for existing call sites. Prefer fixing new code rather than
# expanding this list.
[workspace.lints.clippy]
too_many_arguments = "allow"
field_reassign_with_default = "allow"
