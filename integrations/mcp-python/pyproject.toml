[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "memquira-mcp"
dynamic = ["version"]
description = "Memquira long-term memory tools for MCP clients such as Claude Code and Cursor"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "memory", "ai-agents", "claude-code", "cursor"]
dependencies = [
    "memquira>=0.1,<0.2",
    "mcp>=2.3,<3",
    "httpx>=0.25,<1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=8", "mypy>=1.10", "ruff>=0.6"]

[project.scripts]
memquira-mcp = "memquira_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/Memquira/memquira"
Documentation = "https://github.com/Memquira/memquira/tree/main/integrations/mcp-python"
Issues = "https://github.com/Memquira/memquira/issues"

[tool.hatch.version]
path = "src/memquira_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/memquira_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[[tool.mypy.overrides]]
module = ["mcp.*", "mcp_types.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: needs a running Memquira server (MEMQUIRA_E2E_* variables)"]
