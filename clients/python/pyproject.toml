[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "memquira"
dynamic = ["version"]
description = "Python client for the Memquira memory API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.25,<1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=8", "mypy>=1.10", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Memquira/memquira"
Documentation = "https://github.com/Memquira/memquira/tree/main/clients/python"
Issues = "https://github.com/Memquira/memquira/issues"

[tool.hatch.version]
path = "src/memquira/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/memquira"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
